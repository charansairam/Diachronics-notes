version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:17"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    cooldown:
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2
    commit-message:
      prefix: "deps"
      include: scope
    labels:
      - dependencies
      - npm
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:29"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 2
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"
